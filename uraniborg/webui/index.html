<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP: the app talks only to the origin it was served from, which is
      the local helper when Observe is used (see server/README.md) and nothing
      otherwise. Every remote fetch/connect vector is forbidden outright. Hubble
      observations can contain sensitive device inventory; with no other origin
      reachable, the data cannot leave the host.
      (frame-ancestors is omitted here because it is only honoured via an HTTP
      header, not a meta element; set it at the server if you host this.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Uraniborg Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
